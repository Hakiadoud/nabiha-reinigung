# Konfiguration für Pages CMS (https://app.pagescms.org)
media:
  input: img
  output: /img
  categories: [image]
content:
  - name: kontakt
    label: "📞 Kontakt & Öffnungszeiten"
    type: file
    path: content/kontakt.json
    format: json
    fields:
      - name: contact
        label: Kontaktdaten
        type: object
        fields:
          - { name: company, label: "Firmenname", type: string, required: true }
          - { name: owner, label: "Inhaberin", type: string, required: true }
          - { name: street, label: "Straße und Hausnummer", type: string, required: true }
          - { name: city, label: "PLZ und Ort", type: string, required: true }
          - { name: phone, label: "Telefon (Anzeige, z. B. 0179 5242045)", type: string, required: true }
          - { name: phone_intl, label: "Telefon international (z. B. +491795242045)", type: string, required: true }
          - { name: whatsapp, label: "WhatsApp-Nummer ohne + (z. B. 491795242045)", type: string, required: true }
          - { name: email, label: "E-Mail", type: string, required: true }
          - { name: google_review, label: "Google-Bewertungslink", type: string, required: true }
      - name: hours
        label: Öffnungszeiten
        type: object
        fields:
          - { name: weekdays, label: "Mo–Fr (z. B. 08:00–18:00)", type: string }
          - { name: saturday, label: "Samstag (z. B. 09:00–14:00)", type: string }
      - name: towns
        label: "Einsatzgebiet (Orte, der erste wird hervorgehoben)"
        type: string
        list: true
  - name: leistungen
    label: "🧽 Leistungen (Karten mit Bild)"
    type: file
    path: content/leistungen.json
    format: json
    list: true
    fields:
      - { name: image, label: "Bild (Querformat 4:3)", type: image }
      - name: icon
        label: Symbol
        type: select
        options:
          values: [building, monitor, stairs, window, sparkle, box, sofa, home]
      - { name: alt, label: "Bildbeschreibung für Google (Deutsch)", type: string }
      - name: title
        label: Titel
        type: object
        fields:
          - { name: de, label: "Deutsch", type: string }
          - { name: ar, label: "العربية (Arabisch)", type: string }
          - { name: ku, label: "Kurdî (Kurdisch)", type: string }
          - { name: tr, label: "Türkçe (Türkisch)", type: string }
          - { name: en, label: "English (Englisch)", type: string }
          - { name: fr, label: "Français (Französisch)", type: string }
      - name: text
        label: Kurzbeschreibung
        type: object
        fields:
          - { name: de, label: "Deutsch", type: text }
          - { name: ar, label: "العربية (Arabisch)", type: text }
          - { name: ku, label: "Kurdî (Kurdisch)", type: text }
          - { name: tr, label: "Türkçe (Türkisch)", type: text }
          - { name: en, label: "English (Englisch)", type: text }
          - { name: fr, label: "Français (Französisch)", type: text }
  - name: faq
    label: "❓ Häufige Fragen"
    type: file
    path: content/faq.json
    format: json
    list: true
    fields:
      - name: q
        label: Frage
        type: object
        fields:
          - { name: de, label: "Deutsch", type: string }
          - { name: ar, label: "العربية (Arabisch)", type: string }
          - { name: ku, label: "Kurdî (Kurdisch)", type: string }
          - { name: tr, label: "Türkçe (Türkisch)", type: string }
          - { name: en, label: "English (Englisch)", type: string }
          - { name: fr, label: "Français (Französisch)", type: string }
      - name: a
        label: Antwort
        type: object
        fields:
          - { name: de, label: "Deutsch", type: text }
          - { name: ar, label: "العربية (Arabisch)", type: text }
          - { name: ku, label: "Kurdî (Kurdisch)", type: text }
          - { name: tr, label: "Türkçe (Türkisch)", type: text }
          - { name: en, label: "English (Englisch)", type: text }
          - { name: fr, label: "Français (Französisch)", type: text }
